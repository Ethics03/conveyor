[package]
name = "conveyor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A self-hosted runtime for persistent agents"
readme = "README.md"
publish.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
conveyor-agent = { path = "crates/conveyor-agent" }
conveyor-core = { path = "crates/conveyor-core" }
conveyor-harness = { path = "crates/conveyor-harness" }
conveyor-http = { path = "crates/conveyor-http" }
conveyor-reqwest = { path = "crates/conveyor-reqwest" }
conveyor-storage = { path = "crates/conveyor-storage" }
conveyor-tools = { path = "crates/conveyor-tools" }

bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"

[dependencies]
conveyor-agent.workspace = true
conveyor-core = { workspace = true, features = ["anthropic"] }
conveyor-harness.workspace = true
conveyor-http.workspace = true
conveyor-reqwest.workspace = true
conveyor-storage.workspace = true
conveyor-tools.workspace = true
