[package]
name = "conveyor"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A self-hosted runtime for persistent agents"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
